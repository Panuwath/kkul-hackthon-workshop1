services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pema-kku:latest
    container_name: pema-kku-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP_ENV: production
      PORT: 3000
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    ports:
      - "${APP_PORT:-3061}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/pema/api/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
