name: CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type Check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Build Next.js
        run: npm run build

  deploy:
    name: Deploy
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH || '/var/www/pema' }}
          APP_PORT: ${{ secrets.APP_PORT || '3061' }}
        run: |
          if [ -n "$SERVER_HOST" ] && [ -n "$SERVER_USER" ] && [ -n "$SERVER_SSH_KEY" ]; then
            echo "🚀 Starting automated deployment to $SERVER_HOST..."
            mkdir -p ~/.ssh
            echo "$SERVER_SSH_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            
            # Package code
            tar -czf deploy.tar.gz \
              --exclude='./.git' \
              --exclude='./node_modules' \
              --exclude='./.next' \
              --exclude='./coverage' \
              .
            
            # Transfer & Deploy
            scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa deploy.tar.gz "$SERVER_USER@$SERVER_HOST:$REMOTE_PATH/deploy.tar.gz"
            ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa "$SERVER_USER@$SERVER_HOST" "
              set -eu
              mkdir -p $REMOTE_PATH
              cd $REMOTE_PATH
              tar -xzf deploy.tar.gz
              rm -f deploy.tar.gz
              APP_PORT=$APP_PORT docker compose -p pema-kku up -d --build
              echo '✅ PEMA container successfully updated and running on port $APP_PORT'
            "
          else
            echo "ℹ️ SSH secrets not configured on GitHub. Quality checks & build succeeded."
          fi
